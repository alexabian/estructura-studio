<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>estructura.studio</title>
    <meta name="description" content="estructura.studio" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --fg: #f3f3f3;
        --muted: rgba(243, 243, 243, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(72vw, 320px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .mark {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      svg.ring {
        width: 100%;
        height: 100%;
        animation: spin 12s linear infinite;
        overflow: visible;
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.06));
      }

      .ring text {
        fill: var(--fg);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: lowercase;
      }

      .ring .word {
        fill: var(--fg);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2.2px;
        text-transform: lowercase;
      }

      .ring .dot {
        fill: var(--fg);
      }

      .ring .guide {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1;
      }

      .ring .guide.inner {
        stroke: rgba(243, 243, 243, 0.1);
      }

      .ring .center-dot {
        fill: var(--fg);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 640px) {
        main {
          width: min(82vw, 280px);
        }

        .ring text {
          font-size: 10px;
          letter-spacing: 3px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="estructura.studio landing page">
      <div class="mark">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path id="topArc" d="M48,100 A52,52 0 0,1 152,100" />
            <path id="bottomArc" d="M48,100 A52,52 0 0,0 152,100" />
          </defs>

          <circle class="guide" cx="100" cy="100" r="18" />
          <circle class="guide inner" cx="100" cy="100" r="10" />
          <circle class="center-dot" cx="100" cy="100" r="2.8" />

          <text class="word">
            <textPath href="#topArc" startOffset="50%" text-anchor="middle">estructura</textPath>
          </text>
          <text class="word">
            <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">estructura</textPath>
          </text>

          <text class="word" x="35" y="100" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 35 100)">studio</text>
          <text class="word" x="165" y="100" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 165 100)">estudio</text>

          <circle class="dot" cx="35" cy="100" r="2.2" />
          <circle class="dot" cx="100" cy="35" r="2.2" />
          <circle class="dot" cx="165" cy="100" r="2.2" />
          <circle class="dot" cx="100" cy="165" r="2.2" />
        </svg>
      </div>
    </main>
  </body>
</html>
