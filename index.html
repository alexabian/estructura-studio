<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>estructura.studio</title>
    <meta name="description" content="Minimal landing page for the estructura.studio root domain." />
    <link rel="canonical" href="https://estructura.studio/" />
    <meta property="og:title" content="estructura.studio" />
    <meta property="og:description" content="Minimal landing page for the estructura.studio root domain." />
    <meta property="og:url" content="https://estructura.studio/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="estructura.studio" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="estructura.studio" />
    <meta name="twitter:description" content="Minimal landing page for the estructura.studio root domain." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --fg: #f3f3f3;
        --muted: rgba(243, 243, 243, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(72vw, 320px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .mark {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .orbit {
        position: absolute;
        inset: 0;
        animation: spin 12s linear infinite;
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.06));
      }

      .label {
        position: absolute;
        color: var(--fg);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2.2px;
        text-transform: lowercase;
        line-height: 1;
        white-space: nowrap;
      }

      .label.top {
        top: 17%;
        left: 50%;
        transform: translateX(-50%) rotate(180deg);
      }

      .label.bottom {
        bottom: 17%;
        left: 50%;
        transform: translateX(-50%);
      }

      .label.left {
        left: 17%;
        top: 50%;
        transform: translateY(-50%) rotate(-90deg);
      }

      .label.right {
        right: 17%;
        top: 50%;
        transform: translateY(-50%) rotate(90deg);
      }

      .orbit-dot {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--fg);
      }

      .orbit-dot.top {
        top: 9%;
        left: 50%;
        transform: translateX(-50%);
      }

      .orbit-dot.right {
        right: 9%;
        top: 50%;
        transform: translateY(-50%);
      }

      .orbit-dot.bottom {
        bottom: 9%;
        left: 50%;
        transform: translateX(-50%);
      }

      .orbit-dot.left {
        left: 9%;
        top: 50%;
        transform: translateY(-50%);
      }

      .core {
        position: absolute;
        inset: 50%;
        width: 28%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 1px solid var(--muted);
        border-radius: 50%;
      }

      .core::before,
      .core::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }

      .core::before {
        inset: 18%;
        border: 1px solid rgba(243, 243, 243, 0.1);
      }

      .core::after {
        width: 6px;
        height: 6px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: var(--fg);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 640px) {
        main {
          width: min(82vw, 280px);
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="estructura.studio landing page">
      <h1 class="sr-only">estructura.studio</h1>
      <p class="sr-only">Minimal landing page showing the animated estructura.studio brand mark.</p>
      <div class="mark">
        <div class="orbit" aria-hidden="true">
          <div class="label top">estructura</div>
          <div class="label right">estudio</div>
          <div class="label bottom">estructura</div>
          <div class="label left">studio</div>

          <div class="orbit-dot top"></div>
          <div class="orbit-dot right"></div>
          <div class="orbit-dot bottom"></div>
          <div class="orbit-dot left"></div>
        </div>

        <div class="core" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
