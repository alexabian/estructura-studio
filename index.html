<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>estructura.studio</title>
    <meta name="description" content="estructura.studio" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --fg: #f3f3f3;
        --muted: rgba(243, 243, 243, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(72vw, 320px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .mark {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      svg.ring {
        width: 100%;
        height: 100%;
        animation: spin 12s linear infinite;
        overflow: visible;
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.06));
      }

      .ring text {
        fill: var(--fg);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 4px;
        text-transform: lowercase;
      }

      .core {
        position: absolute;
        inset: 50%;
        width: 28%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 1px solid var(--muted);
        border-radius: 50%;
        display: grid;
        place-items: center;
      }

      .core::before,
      .core::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }

      .core::before {
        inset: 18%;
        border: 1px solid rgba(243, 243, 243, 0.1);
      }

      .core::after {
        width: 6px;
        height: 6px;
        background: var(--fg);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 640px) {
        main {
          width: min(82vw, 280px);
        }

        .ring text {
          font-size: 10px;
          letter-spacing: 3px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="estructura.studio landing page">
      <div class="mark">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path id="circlePath" d="M100,100 m-70,0 a70,70 0 1,0 140,0 a70,70 0 1,0 -140,0" />
          </defs>
          <text>
            <textPath href="#circlePath">
              estructura • studio • estructura • studio • estructura • studio •
            </textPath>
          </text>
        </svg>
        <div class="core" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
